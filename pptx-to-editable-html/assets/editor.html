<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf5;color:#202438;font:14px Arial,"PingFang SC",sans-serif}button,input,select{font:inherit}button{border:1px solid #dce0ee;background:white;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#edf0ff}button.active{background:#dce1ff}header{padding:12px 18px;background:#17213e;color:white;display:flex;align-items:center;gap:15px}header strong{margin-right:auto}#tools{background:#fff;padding:8px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #d3d8e7}#tools input[type=number]{width:62px}#tools input[type=color]{width:32px;height:30px;padding:1px;border:0}#tools select{width:105px}main{display:flex;height:calc(100vh - 180px);min-height:360px}aside{width:190px;overflow:auto;padding:12px;flex-shrink:0;background:#f7f8fc}.thumb{width:164px;height:112px;position:relative;margin-bottom:14px;cursor:pointer;border:2px solid transparent;border-radius:5px;padding:4px;background:white}.thumb.current{border-color:#6670e9}.mini{width:1280px;height:720px;transform:scale(.12);transform-origin:top left;position:absolute;overflow:hidden;pointer-events:none}.thumb small{position:absolute;bottom:0;left:8px;font-size:10px}#workspace{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}#frame{position:relative;flex-shrink:0;box-shadow:0 8px 35px #24345b22}#canvas{width:1280px;height:720px;transform-origin:top left;position:absolute;overflow:hidden;background:white;touch-action:none}.object{position:absolute;user-select:none;overflow:visible;cursor:move}.text{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px;line-height:1.25}.text[contenteditable=true]{user-select:text;cursor:text;outline:2px solid #8e7bf7;overflow:auto}.shape{border:2px solid}.object img{width:100%;height:100%;pointer-events:none;display:block}.selected{outline:2px solid #7061ef}.handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #7061ef;z-index:10000}.nw{left:-6 .object.vector svg{pointer-events:none}.vector{padding:0;border:0}body.present .selected{outline:none}</style>
<header><strong id="title"></strong><span id="count"></span><button id="save">保存 HTML</button><button id="present">▶ 放映 F11</button></header>
<div id="tools"><select id="objectPick" style="width:240px"></select><button id="editVector">编辑选中文字</button><button id="vectorColor">矢量填色</button><button id="vectorStroke">矢量描边</button><button id="vectorText">文字样式</button>

</div>
<main><aside id="thumbs"></aside><div id="workspace"><div id="frame"><div id="canvas" tabindex="0"></div></div></div></main><footer>双击文字编辑 · Shift 点击多选 · 四角缩放 · 方向键微调（Shift 加速）· Ctrl/Cmd+S 导出 · Esc 退出文字编辑或放映</footer><button id="exit">退出放映 Esc</button><input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script id="deck-data" type="application/json">__DECK_JSON__</script>
<script>
(()=>{'use strict';
let deck=JSON.parse(document.getElementById('deck-data').textContent),page=0,selected=[],present=false,scale=1,editing=null,history=[],future=[],drag=null;
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o)),uid=()=> 'o'+Math.random().toString(36).slice(2,11),slide=()=>deck.slides[page],items=()=>slide().elements,chosen=()=>items().filter(e=>selected.includes(e.id));
function ids(es){es.forEach(e=>{e.id=uid();if(e.children)ids(e.children)})}deck.slides.forEach(s=>{s.elements??=[];s.elements.forEach(e=>{e.id??=uid()})});
function snapshot(){return JSON.stringify({deck,page})}function checkpoint(){history.push(snapshot());if(history.length>15)history.shift();future=[]}function restore(s){let v=JSON.parse(s);deck=v.deck;page=v.page;selected=[];render()}
function undo(){if(!history.length)return;future.push(snapshot());restore(history.pop())}function redo(){if(!future.length)return;history.push(snapshot());restore(future.pop())}
function mutate(fn){if(present)return;finish();checkpoint();fn();slide().edited=true;render()}
function finish(){if(editing){editing.contentEditable='false';editing=null;thumbs()}}
function style(e,n){Object.assign(n.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',background:e.fill||'transparent',borderColor:e.stroke||'transparent'});if(e.type==='text')Object.assign(n.style,{fontFamily:e.font||'Arial',fontSize:(e.size||32)+'px',fontWeight:e.bold?'700':'400',fontStyle:e.italic?'italic':'normal',color:e.color||'#202438',border:'2px solid '+(e.stroke||'transparent')});}
function node(e,mini=false,child=false){let n=document.createElement('div');n.className='object '+(e.type==='text'?'text':e.type==='rect'||e.type==='ellipse'?'shape':e.type==='vector'?'vector':'');n.dataset.id=e.id;style(e,n);if(e.type==='vector'){n.innerHTML=e.svg;n.style.background='transparent';n.querySelector('svg').style.pointerEvents='none';if(!mini&&!child)n.addEventListener('dblclick',ev=>{if(present||e.text===null)return;ev.stopPropagation();openTextEditor(e);})}if(e.type==='ellipse')n.style.borderRadius='50%';if(e.type==='text')n.textContent=e.text||'';if(e.type==='image'){let im=document.createElement('img');im.src=e.src;im.style.objectFit=e.fit||'contain';n.append(im)}if(e.type==='group')(e.children||[]).forEach(c=>n.append(node(c,mini,true)));
if(!mini&&!child){if(selected.includes(e.id)&&!present){n.classList.add('selected');for(let c of ['nw','ne','sw','se']){let h=document.createElement('i');h.className='handle '+c;h.dataset.corner=c;n.append(h)}}n.addEventListener('pointerdown',ev=>pointer(ev,e,n));n.addEventListener('dblclick',ev=>{if(present||e.type!=='text')return;ev.stopPropagation();selected=[e.id];render();let t=[...$('canvas').children].find(t=>t.dataset.id===e.id);t.querySelectorAll('.handle').forEach(h=>h.remove());checkpoint();t.contentEditable='true';editing=t;t.focus();let range=document.createRange();range.selectNodeContents(t);let s=getSelection();s.removeAllRanges();s.addRange(range);t.addEventListener('input',()=>{e.text=t.innerText});t.addEventListener('paste',ev=>{ev.preventDefault();let text=ev.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)});t.addEventListener('blur',()=>{if(editing===t)finish()})})}return n}
function thumbs(){let host=$('thumbs');host.replaceChildren();deck.slides.forEach((s,i)=>{let t=document.createElement('div');t.className='thumb'+(page===i?' current':'');let m=document.createElement('div');m.className='mini';m.style.background=s.background||'#fff';if(i===page||s.edited){if(s.defs){let ds=document.createElementNS('http://www.w3.org/2000/svg','svg');ds.style.cssText='position:absolute;width:0;height:0';ds.innerHTML=s.defs;m.append(ds)}s.elements.forEach(e=>m.append(node(e,true)))}else{let im=document.createElement('img');im.src=s.thumb;im.style.cssText='width:1280px;height:720px';m.append(im)}let label=document.createElement('small');label.textContent=(i+1)+' · '+s.title;t.append(m,label);t.onclick=()=>{if(present)return;finish();page=i;selected=[];render()};host.append(t)})}
function fit(){let r=$('workspace').getBoundingClientRect(),pad=present?0:48;scale=Math.max(.05,Math.min((r.width-pad)/1280,(r.height-pad)/720));$('frame').style.width=1280*scale+'px';$('frame').style.height=720*scale+'px';$('canvas').style.transform=`scale(${scale})`}
function render(){let c=$('canvas');c.replaceChildren();if(slide().defs){let ds=document.createElementNS('http://www.w3.org/2000/svg','svg');ds.style.cssText='position:absolute;width:0;height:0;pointer-events:none';ds.innerHTML=slide().defs;c.append(ds)}c.style.background=slide().background||'#fff';items().forEach(e=>c.append(node(e)));$('title').textContent=deck.title;$('count').textContent=`${String(page+1).padStart(2,'0')}/${String(deck.slides.length).padStart(2,'0')}`;document.title=deck.title;thumbs();fit();syncStyle();let pick=$('objectPick');pick.replaceChildren();let first=document.createElement('option');first.textContent='选择页面文字或图形';first.value='';pick.append(first);items().forEach((e,i)=>{let o=document.createElement('option');o.value=e.id;o.textContent=(i+1)+' · '+(e.text===null?(e.kind||e.type):e.text).slice(0,45);o.selected=selected.includes(e.id);pick.append(o)})}
function syncStyle(){let e=chosen()[0];if(e){$('size').value=e.size||32;$('font').value=e.font||'Arial';for(let k of ['color','fill','stroke'])if(/^#[0-9a-f]{6}$/i.test(e[k]||''))$(k).value=e[k];$('bold').classList.toggle('active',!!e.bold);$('italic').classList.toggle('active',!!e.italic)}}
function paintSelection(){for(let n of $('canvas').children){n.classList.toggle('selected',selected.includes(n.dataset.id));n.querySelectorAll(':scope > .handle').forEach(h=>h.remove());if(selected.includes(n.dataset.id))for(let c of ['nw','ne','sw','se']){let h=document.createElement('i');h.className='handle '+c;h.dataset.corner=c;n.append(h)}}syncStyle()}
function pointer(ev,e,n){if(present||ev.button!==0||editing===n)return;finish();ev.stopPropagation();ev.preventDefault();let corner=ev.target.dataset.corner;if(ev.shiftKey&&!corner){selected=selected.includes(e.id)?selected.filter(id=>id!==e.id):[...selected,e.id];paintSelection();return}if(!selected.includes(e.id))selected=[e.id];checkpoint();drag={x:ev.clientX,y:ev.clientY,corner,id:e.id,before:clone(chosen())};paintSelection()}
function resizeChildren(es,sx,sy){es.forEach(e=>{e.x*=sx;e.y*=sy;e.w*=sx;e.h*=sy;if(e.size)e.size*=Math.min(sx,sy);if(e.children)resizeChildren(e.children,sx,sy)})}
window.addEventListener('pointermove',ev=>{if(!drag||present)return;slide().edited=true;let dx=(ev.clientX-drag.x)/scale,dy=(ev.clientY-drag.y)/scale;for(let old of drag.before){let e=items().find(e=>e.id===old.id);if(!drag.corner){e.x=old.x+dx;e.y=old.y+dy}else if(e.id===drag.id){let west=drag.corner.includes('w'),north=drag.corner.includes('n');e.w=Math.max(20,old.w+(west?-dx:dx));e.h=Math.max(20,old.h+(north?-dy:dy));e.x=west?old.x+old.w-e.w:old.x;e.y=north?old.y+old.h-e.h:old.y;if(old.children){e.children=clone(old.children);resizeChildren(e.children,e.w/old.w,e.h/old.h)}}}render()});window.addEventListener('pointerup',()=>drag=null);
$('canvas').addEventListener('pointerdown',ev=>{if(!present&&ev.target===$('canvas')){finish();selected=[];render()}});
const actions={undo,redo,addText:()=>add('text'),addRect:()=>add('rect'),addEllipse:()=>add('ellipse'),duplicate:()=>{let es=clone(chosen());ids(es);es.forEach(e=>{e.x+=24;e.y+=24});items().push(...es);selected=es.map(e=>e.id)},remove:()=>{slide().elements=items().filter(e=>!selected.includes(e.id));selected=[]},group:()=>{let es=chosen();if(es.length<2)return;let x=Math.min(...es.map(e=>e.x)),y=Math.min(...es.map(e=>e.y)),w=Math.max(...es.map(e=>e.x+e.w))-x,h=Math.max(...es.map(e=>e.y+e.h))-y;let g={id:uid(),type:'group',x,y,w,h,children:clone(es).map(e=>({...e,x:e.x-x,y:e.y-y}))};let at=items().findIndex(e=>selected.includes(e.id));slide().elements=items().filter(e=>!selected.includes(e.id));items().splice(at,0,g);selected=[g.id]},ungroup:()=>{let out=[];items().forEach(e=>{if(selected.includes(e.id)&&e.type==='group')out.push(...e.children.map(c=>({...c,x:c.x+e.x,y:c.y+e.y})));else out.push(e)});slide().elements=out;selected=[]},front:()=>slide().elements=[...items().filter(e=>!selected.includes(e.id)),...chosen()],back:()=>slide().elements=[...chosen(),...items().filter(e=>!selected.includes(e.id))],newSlide:()=>{deck.slides.splice(page+1,0,{title:'新页面',background:'#ffffff',elements:[]});page++;selected=[]},copySlide:()=>{let s=clone(slide());ids(s.elements);deck.slides.splice(page+1,0,s);page++;selected=[]},deleteSlide:()=>{if(deck.slides.length>1){deck.slides.splice(page,1);page=Math.min(page,deck.slides.length-1);selected=[]}}};
function add(type){let e={id:uid(),type,x:120,y:160,w:360,h:type==='text'?90:180,fill:type==='text'?'transparent':'#dce1ff',stroke:'transparent',text:'双击编辑文字',size:36,color:'#242949'};items().push(e);selected=[e.id]}
for(let a of ['left','center','right','top','middle','bottom'])actions[a]=()=>{let es=chosen();if(!es.length)return;let l=Math.min(...es.map(e=>e.x)),r=Math.max(...es.map(e=>e.x+e.w)),t=Math.min(...es.map(e=>e.y)),b=Math.max(...es.map(e=>e.y+e.h));if(es.length===1){l=0;r=1280;t=0;b=720}es.forEach(e=>{if(a==='left')e.x=l;if(a==='center')e.x=(l+r-e.w)/2;if(a==='right')e.x=r-e.w;if(a==='top')e.y=t;if(a==='middle')e.y=(t+b-e.h)/2;if(a==='bottom')e.y=b-e.h})};
for(let axis of ['X','Y'])actions['distribute'+axis]=()=>{let k=axis==='X'?'x':'y',d=axis==='X'?'w':'h',es=chosen().sort((a,b)=>a[k]-b[k]);if(es.length<3)return;let first=es[0][k],last=es.at(-1)[k]+es.at(-1)[d],gap=(last-first-es.reduce((s,e)=>s+e[d],0))/(es.length-1),pos=first;es.forEach(e=>{e[k]=pos;pos+=e[d]+gap})};
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(present)return;if(['undo','redo'].includes(b.dataset.act)){finish();actions[b.dataset.act]()}else mutate(actions[b.dataset.act])});
function applyStyle(k,v){mutate(()=>{function walk(e){if(e.type==='group')e.children.forEach(walk);else e[k]=v}chosen().forEach(walk)})}for(let k of ['font','size','color','fill','stroke'])$(k).onchange=()=>{if(k==='size'){let n=Number($(k).value);if(!Number.isFinite(n)||n<8||n>240)return;applyStyle(k,n)}else applyStyle(k,$(k).value)};for(let k of ['bold','italic'])$(k).onclick=()=>{if(!present)applyStyle(k,!chosen()[0]?.[k])};
$('image').onclick=()=>{if(!present)$('file').click()};$('file').onchange=async()=>{let f=$('file').files[0];if(!f||present||!/^image\/(png|jpeg|webp|gif)$/.test(f.type))return;let src=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(present)return;mutate(()=>{let e={id:uid(),type:'image',x:200,y:160,w:480,h:320,src};items().push(e);selected=[e.id]});$('file').value=''};
function exportHTML(){finish();let doc=document.documentElement.cloneNode(true);doc.querySelector('#deck-data').textContent=JSON.stringify(deck).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');doc.querySelector('#canvas').replaceChildren();doc.querySelector('#thumbs').replaceChildren();doc.querySelector('body').classList.remove('present');let blob=new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(deck.title||'slides').replace(/[\\/:*?"<>|]/g,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}$('save').onclick=exportHTML;
async function setPresent(on){finish();drag=null;selected=[];present=on;document.body.classList.toggle('present',on);render();if(on){try{await document.documentElement.requestFullscreen()}catch{}}else if(document.fullscreenElement){try{await document.exitFullscreen()}catch{}}fit()}$('present').onclick=()=>setPresent(true);$('exit').onclick=()=>setPresent(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&present){present=false;document.body.classList.remove('present');render()}});window.addEventListener('resize',fit);
window.addEventListener('keydown',ev=>{let key=ev.key,mod=ev.ctrlKey||ev.metaKey;if(mod&&key.toLowerCase()==='s'){ev.preventDefault();exportHTML();return}if(key==='F11'){ev.preventDefault();setPresent(!present);return}if(present){if(key==='Escape'){ev.preventDefault();setPresent(false);return}let next=page;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(key))next++;if(['ArrowLeft','ArrowUp','PageUp'].includes(key))next--;if(key==='Home')next=0;if(key==='End')next=deck.slides.length-1;if(next!==page){ev.preventDefault();page=Math.max(0,Math.min(deck.slides.length-1,next));render()}return}if(editing){if(key==='Escape'){ev.preventDefault();finish();render()}return}if(/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;if(mod&&key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}if(mod&&key.toLowerCase()==='y'){ev.preventDefault();redo();return}if(mod&&key.toLowerCase()==='d'){ev.preventDefault();mutate(actions.duplicate);return}if(key==='Delete'||key==='Backspace'){ev.preventDefault();mutate(actions.remove);return}if(selected.length&&key.startsWith('Arrow')){ev.preventDefault();mutate(()=>chosen().forEach(e=>{let d=ev.shiftKey?10:1;if(key==='ArrowLeft')e.x-=d;if(key==='ArrowRight')e.x+=d;if(key==='ArrowUp')e.y-=d;if(key==='ArrowDown')e.y+=d}));return}if(!selected.length&&['ArrowRight','ArrowLeft',' ','PageDown','PageUp'].includes(key)){ev.preventDefault();page=Math.max(0,Math.min(deck.slides.length-1,page+(['ArrowRight',' ','PageDown'].includes(key)?1:-1)));render()}});

function openTextEditor(e){if(present)return;let dlg=document.createElement('dialog');dlg.style.cssText='width:660px;padding:24px;border:1px solid #ccc;border-radius:12px';let heading=document.createElement('h3');heading.textContent='编辑完整文字框';let ta=document.createElement('textarea');ta.value=e.text;ta.style.cssText='width:100%;height:230px;font:18px Microsoft YaHei,system-ui;line-height:1.6';let ok=document.createElement('button');ok.textContent='保存文字';let cancel=document.createElement('button');cancel.textContent='取消';dlg.append(heading,ta,ok,cancel);document.body.append(dlg);dlg.showModal();ta.focus();cancel.onclick=()=>dlg.remove();ok.onclick=()=>{checkpoint();e.text=ta.value;slide().edited=true;let div=document.createElement('div');div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');div.style.cssText='width:100%;height:100%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;font-family:'+ (e.editFont||'Microsoft YaHei')+';font-size:'+(e.editSize||18)+'px;color:'+(e.editColor||'#182033');div.textContent=e.text;e.svg='<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 '+e.w+' '+e.h+'"><foreignObject x="0" y="0" width="'+e.w+'" height="'+e.h+'">'+new XMLSerializer().serializeToString(div)+'</foreignObject></svg>';dlg.remove();render()};}

$('editVector').onclick=()=>{let e=chosen().find(e=>e.type==='vector'&&e.text!==null);if(!e)return;let n=[...$('canvas').children].find(n=>n.dataset.id===e.id);n.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}))};$('objectPick').onchange=ev=>{selected=[ev.target.value];render()};

function patchVector(mode){if(present)return;let es=chosen().filter(e=>e.type==='vector');if(!es.length)return;let value=prompt(mode==='text'?'字号（原页面坐标，例 18）': '颜色（例 #2386ee）',mode==='text'?'18':'#2386ee');if(!value)return;checkpoint();slide().edited=true;es.forEach(e=>{let d=new DOMParser().parseFromString(e.svg,'image/svg+xml');if(mode==='text'){e.editSize=parseFloat(value);d.querySelectorAll('foreignObject div').forEach(n=>n.style.fontSize=parseFloat(value)+'px');d.querySelectorAll('text,tspan').forEach(n=>n.setAttribute('font-size',parseFloat(value)))}else{d.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line,text,tspan').forEach(n=>n.setAttribute(mode==='stroke'?'stroke':'fill',value))}e.svg=new XMLSerializer().serializeToString(d.documentElement)});render()}
$('vectorColor').onclick=()=>patchVector('fill');$('vectorStroke').onclick=()=>patchVector('stroke');$('vectorText').onclick=()=>patchVector('text');
render();
})();
</script></html>
